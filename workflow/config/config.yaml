# Config for the promoter-mining pipeline.
# Data paths. Override any of them with --config key=value.

# --- Data locations ---
# T6 Bakta outputs. Accepts EITHER:
#   - a .zip: its top folder all_bakta_output/ holds the 166 nested
#     <genome>_genomic_output/<genome>_genomic.{gff3,fna,tsv} — rule extract_bakta unzips it; or
#   - an already-extracted directory (local dev) whose children are <genome>_genomic_output/.
# Phase B (T11-T14) auto-detects which and normalises internally.
# A RELATIVE path is resolved against the repo root, so it works wherever the repo is pulled
# (a laptop, a cluster, etc.) — the zip ships inside the repo via Git-LFS. Use an ABSOLUTE path only to
# point at an out-of-repo copy, e.g. --config bakta_dir=/data/bakta_outputs
bakta_dir: "pipeline/acquisition/bakta-annotations/all_bakta_output.zip"

# T5 genomes: 166 RefSeq .fna inside one Git-LFS zip. Source for the reference
# FASTAs used by T7b / T10 (must be unzipped first — see local_prep t5 rule).
genomes_zip: "pipeline/acquisition/clostridium-genomes/Clostridium_genomes_v2_166.zip"

# T6 Bakta DB (light, ~30 GB) — ONLY needed to REGENERATE annotations (local_prep t6 rule).
# The committed all_bakta_output.zip is the canonical artifact; re-running bakta is opt-in.
# Download once: `bakta_db download --output <dir> --type light`, then point here.
bakta_db: "/path/to/bakta/db-light"

# T7 dRNA-seq accession list consumed by T10 (TSSpredator): 20 runs.
srr_list: "pipeline/acquisition/tss-literature/SRR_dRNAseq_for_TSSpredator.txt"

# --- Parameters ---
upstream_window_bp: 300     # T12 contig-end window + T13 extraction window (bp)
operon_max_dist_bp: 100     # T12 max intra-operon gene gap (bp)
cdhit_identity: 0.6         # T15 clustering identity (reviewer: 0.6, stricter anti-leakage). <0.8 auto-routes to MMseqs2 — cd-hit-est can't cluster DNA below ~0.8
random_seed: 42             # passed to T14 negative generation and T15 splitting
t9_train_fraction: 0.0      # Hold ALL of T9 out for eval (T24/T26). The "option b" of splitting T9
                            # into training was a workaround for when T7b was empty; T7b now supplies
                            # 5,759 reported published-TSS windows before exact-sequence dedup, so T9 (~49–52bp, would need N-padding)
                            # stays fully held out. Set >0 only to put padded T9 back into the T15 train split.
