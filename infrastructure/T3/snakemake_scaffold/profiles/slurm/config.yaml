# Slurm profile (Snakemake 8+, snakemake-executor-plugin-slurm).
# One entry point for the whole pipeline:
#     snakemake --workflow-profile profiles/slurm
#
# Every rule is submitted as its own Slurm job with the defaults below. A rule
# only needs a `resources:` block when it differs from these (e.g. GPU rules add
# --gpus-per-node=1 via slurm_extra).
#
# ---------------------------------------------------------------------------
# SITE SETTINGS — edit these two for your cluster, or delete them if your site
# needs neither. They are intentionally left blank rather than carrying another
# site's values.
#
#   slurm_account    your accounting/allocation code, if your site requires one
#   slurm_partition  the queue to submit to
#
# Snakemake omits a resource that is set to an empty string, so the defaults
# below work unchanged on a cluster with no account and a default partition.
# ---------------------------------------------------------------------------

executor: slurm
jobs: 20                       # max Slurm jobs in flight at once

default-resources:
  slurm_account: ""            # e.g. "my-allocation"
  slurm_partition: ""          # e.g. "gpu" or "batch"
  runtime: 60                  # minutes
  cpus_per_task: 1
  # No mem_mb default on purpose. Many sites auto-allocate RAM in proportion to
  # CPUs (or per GPU), and on those you must NOT pass --mem on GPU jobs. If your
  # site does require an explicit request, add `mem_mb:` here.
  #
  # Preemption hygiene on every job: requeue when killed, and send SIGUSR1 120s
  # before the kill so the job can checkpoint. The trap itself lives in each
  # training script, not here. Drop this if you submit to a non-preemptible
  # queue.
  slurm_extra: "'--requeue --signal=B:USR1@120'"

# Cost note that generalises: request GPUs per rule (--gpus-per-node=1) rather
# than reserving whole nodes. Avoid --exclusive unless you actually need the
# whole node; on per-GPU billing it multiplies the cost.
restart-times: 2               # auto-resubmit a preempted job up to 2x
