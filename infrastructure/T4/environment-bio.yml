# Promoter Mining — HPC4 bioinformatics CLI environment (companion to environment.yml)
#
# WHY a second env: the MEME suite and the heavy read-processing tools need an older
# `icu`/`libcurl` than the modern conda-forge base in environment.yml, so they CANNOT
# co-solve with the PyTorch/ML stack. They are CPU-only and used by specific tasks:
#   - T10 (TSSpredator): sra-tools, segemehl, openjdk (runs the JAR)
#   - T31 (motif annotation): meme  -> provides FIMO for -10/-35 scanning
#
# Build this ONLY if you own T10 (Sine) or T31 (Leo). The GPU/training people don't need it.
# Build it with micromamba (fast solver), same as the main env:
#
#   ~/bin/micromamba create -y \
#     -p /project/igem2026/envs/promoter-mining-bio \
#     -f /project/igem2026/cb-promoter-mining/infrastructure/T4/environment-bio.yml
#
name: promoter-mining-bio

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - snakemake>=8.0           # drive tss_prep.smk (T10) / the T31 rule from here
  - biopython
  - samtools
  - seqkit
  - bedtools
  - meme>=5.5.0              # FIMO for -10/-35 motif scanning (T31)
  - sra-tools                # prefetch / fasterq-dump for dRNA-seq reads (T10)
  - segemehl                 # T10 read aligner (confirm with Sine; swap for bowtie2/bwa if preferred)
  - openjdk>=11              # Java runtime for the TSSpredator JAR (T10; download the JAR separately)
  - pip
  - pip:
    - snakemake-executor-plugin-slurm
