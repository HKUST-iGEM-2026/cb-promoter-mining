# Promoter Mining — HPC4 conda/mamba environment (Task T4)
#
# Scope: everything that runs on HPC4 — Phase B–E, T10 (TSSpredator), and the two GPU
# pre-tasks on the cluster: PT1 (ProkBERT fine-tune) and PT5 (E. coli sliding-window
# inference). PT1/PT5 use the same torch/ProkBERT stack as T18/T28, already included below.
# Build / verify / lock steps: see DEPLOY.md (same folder).
# Supersedes the earlier draft "task 4" (broken CUDA pin + out-of-scope packages).
name: promoter-mining-hpc4

channels:
  - conda-forge
  - bioconda
  # torch is no longer a conda package (see the pip section) — the pytorch/nvidia channels are gone.
  # 'defaults' intentionally omitted: bioconda recommends conda-forge > bioconda,
  # and this avoids the Anaconda 'defaults' ToS. Prefer: conda config --set channel_priority strict

dependencies:
  # ---- Python ----
  - python=3.11

  # ---- Core scientific / evaluation stack (T15, T22, T23, T25, T26, T29, T30) ----
  - numpy
  - pandas
  - openpyxl                 # .xlsx engine for pandas.read_excel — T7b reads the Hocq published-TSS supplement
  - scipy
  - scikit-learn>=1.3.0      # StratifiedGroupKFold (T15/T23), metrics (T22), calibration (T26)
  - matplotlib-base          # headless (no Qt/pyqt GUI) — the full matplotlib drags in a Qt stack that conflicts on the cluster
  - seaborn
  - statsmodels              # BH multipletests for PT4 / T27 empirical FDR (was only present transitively)
  - requests                 # T8 RegulonDB/DBTBS HTTP fetch (Phase A; harmless to keep here)
  - pyyaml                   # T21 reads its sweep config as YAML (also a snakemake dependency)
  - ipykernel
  - jupyterlab               # interactive work on the login node (optional)

  # ---- Bioinformatics CLI (light, low-conflict; Phase B) ----
  - seqkit                   # FASTA wrangling
  - biopython
  - bedtools                 # interval ops (T12 / T13)
  - samtools                 # faidx for upstream extraction (T13)
  - cd-hit>=4.8              # clustering for cluster-aware splits (T15)
  # meme / sra-tools / segemehl / openjdk now live in environment-bio.yml — the MEME suite needs an
  # older icu/libcurl than this env's modern conda-forge base, so the heavy T10/T31 CLI tools can't
  # co-solve with the PyTorch stack. Build that companion env only if you own T10 (Sine) or T31 (Leo).
  # pybigwig moved to the pip section below (its conda build also conflicts on libcurl).

  # ---- Pipeline orchestration (matches the T3 SLURM scaffold) ----
  - snakemake>=8.0

  # ---- Deep learning (T18-T28) ----
  # torch + torchvision are installed via PIP from the CUDA-12.8 index (see the pip section), NOT
  # conda: the SuperPOD H800 driver maxes at CUDA 12.8, and prokbert needs transformers>=4.56 which
  # needs a newer torch than the conda channel ships — and conda torch kept getting overridden by pip.
  - optuna                   # HPO / hyperparameter sweeps used by T18-T21 (replaces unused scikit-optimize)

  # ---- pip-only ----
  - pip
  - pip:
    # torch + torchvision from the CUDA-12.8 build index (the H800 driver maxes at 12.8). The exact
    # +cu128 local versions force pip onto the cu128 builds — PyPI's default torch is a CUDA-13 build
    # the driver can't run (silent CPU fallback). Keep these listed FIRST so the rest see torch satisfied.
    - --extra-index-url https://download.pytorch.org/whl/cu128
    - torch==2.11.0+cu128
    - torchvision==0.26.0+cu128                       # required by prokbert; matches torch's cu128 build
    - git+https://github.com/nbrg-ppcu/prokbert.git   # ProkBERT-mini (T18)

    # HuggingFace ecosystem (T18 / T19 / T28)
    - transformers>=4.56,<=5.3.0   # REQUIRED by prokbert 0.0.50; torch stays pinned by conda (transformers doesn't bump it). NOTE: T18/T19 templates must use eval_strategy, not evaluation_strategy, at this version (PT1 already does).
    - datasets
    - peft                   # LoRA for Nucleotide Transformer v2 250M (T19)
    - accelerate             # mixed-precision training
    - bitsandbytes           # 8-/4-bit quantization (QLoRA)
    - sentencepiece
    - tokenizers
    - evaluate
    - wandb                  # experiment tracking (optional)

    # Snakemake SLURM executor (required by profiles/slurm — T3)
    - snakemake-executor-plugin-slurm

    # Parsing / IO
    - gffutils               # GFF parsing for upstream extraction (T13)
    - pyarrow                # parquet input (T8) and parquet/JSONL output (T32)
    - pyBigWig               # T28 bigWig score tracks (pip wheel; the conda build conflicts on libcurl)
    - tqdm

    # Negative-set construction — ushuffle (SRS shuffle, T14/T27) is intentionally NOT installed
    # here: its sdist has a fragile C build (stale Cython output -> longintrepr.h error on py3.11).
    # Install it when T14 is actually implemented:  pip install cython
    #   then  pip install --no-build-isolation ushuffle   (or use a bioconda build / pure-python
    #   dinucleotide shuffle). Deferring it keeps the env build from failing for everyone.
