# This file was cleared on 2026-06-19 because its previous contents were corrupt:
# a CUDA 12.1 conda stack mixed with CUDA-13 pip wheels (nvidia-*-cu13,
# cuda-toolkit==13.0.2) plus torch 2.12 / torchvision 0.27. That torch was built
# for a newer NVIDIA driver than the H800 nodes have, so installing from it
# silently fell back to CPU. It was left installable, so it kept reproducing the
# bug — hence this reset.
#
# A real lock can ONLY be produced by solving the environment ON SuperPOD itself:
# the pinned versions/builds must reflect the actual H800 + CUDA-12.1 resolve, and
# cannot be generated off-cluster without inventing version numbers.
#
# >>> TO REGENERATE (on a SuperPOD login node):
#
#       module load <conda-module> cuda/12.1
#       ENV=/project/igem2026/envs/promoter-mining-hpc4
#       mamba env create -f infrastructure/T4/environment.yml -p "$ENV"
#       conda activate "$ENV"
#       # confirm torch is the conda cu121 build BEFORE exporting:
#       python -c "import torch; assert torch.version.cuda=='12.1', torch.version.cuda; \
#                  print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
#       conda env export --no-builds > infrastructure/T4/environment.lock.yml
#
#   Then commit the regenerated file.
#
# UNTIL THEN: build from environment.yml (the readable spec), NOT from this file.
# This placeholder has no `name`/`channels`/`dependencies` keys on purpose, so
